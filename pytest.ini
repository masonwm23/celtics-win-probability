; Scope the suite to tests/ so a bare `pytest` at the project root behaves the
; same as scripts/03_run_tests.py.
;
; Without this, `pytest` collects _removed_lineup_lab/tests/, which is the
; quarantined Lineup Lab code. Those modules import src/position_rules.py,
; which was quarantined with them, so collection fails with an ImportError
; before a single real test runs. That would look like the project is broken
; when it is not.
;
; The quarantined folder is left in place rather than deleted, as instructed.
; This just keeps it out of the collector's path.

[pytest]
testpaths = tests
norecursedirs = _removed_lineup_lab web node_modules .git data models figures
